:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --page:#0d2822; --ink:#f3eee2; --muted:#9db8ae; --panel:#133830; --line:#245247;
  --felt:#1f5a4d; --felt-edge:#17443a; --tile:#f6f1e2; --tile-line:#c9c0a8; --pip:#2a2320;
  --blue:#2f55c9; --blue-ink:#ffffff; --red:#d63a55; --gold:#f2c14e; --coral:#f08a7a;
}
*{box-sizing:border-box}
html,body{margin:0}
html{height:100%}
body{min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{background:var(--page)}
body{background:transparent;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
#backdrop{position:fixed;inset:0;z-index:-1;pointer-events:none;
  --bdy:56vh;
  background:
    var(--bdband,none) center calc(var(--bdy) - 25vw)/100% auto no-repeat,
    linear-gradient(to bottom,var(--sky1,#1d4a3f) 0,var(--sky2,#2a5a4c) var(--bdy),var(--gnd,#3a3020) var(--bdy),var(--gnd2,#14100a) 100%)}
@media (max-width:640px){#backdrop{--bdy:30vh}}
#backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(4,14,11,.34),rgba(4,14,11,.2) 40%,rgba(4,14,11,.18) 70%,rgba(4,14,11,.5))}
#backdrop.rich{background:var(--bdband) 50% var(--bdpy,100%)/auto var(--bdh,100vh) no-repeat,linear-gradient(to bottom,var(--sky1,#1d4a3f) 0,var(--sky2,#2a5a4c) var(--bdtop,0px),var(--gnd,#3a3020) var(--bdbot,100vh),var(--gnd2,#14100a) 100%)}
#backdrop.rich::after{background:linear-gradient(rgba(4,10,16,.42),rgba(4,10,16,.18) 38%,rgba(4,10,16,.1) 70%,rgba(4,10,16,.5))}
#backdrop.img{background:var(--bdimg) 62% var(--bdpy,0px)/auto var(--bdh,100vh) no-repeat,linear-gradient(to bottom,#2f6f95 0,#2f6f95 var(--bdtop,0px),var(--gnd,#3a3020) var(--bdbot,100vh),var(--gnd2,#14100a) 100%)}
#backdrop.img::after{background:linear-gradient(rgba(4,10,16,.3),rgba(4,10,16,.08) 40%,rgba(4,10,16,.2) 62%,rgba(4,10,16,.55))}
/* wide screens: the photo is kept small enough to show its landmarks above the table, to the right of the score cards, over a soft blurred copy of itself */
#backdrop.img.wide{background:#10202a;overflow:hidden}
#backdrop.img.wide::before{content:"";position:absolute;inset:-40px;background:linear-gradient(rgba(4,10,16,.4),rgba(4,10,16,.5)),var(--bdimg) 50% 40%/cover no-repeat;filter:blur(22px)}
#bdleft{display:none;position:absolute;left:0;top:var(--wy);width:var(--ww);height:var(--wh);background:var(--bdimg2) 50% 0/cover no-repeat;-webkit-mask-image:linear-gradient(270deg,transparent 0,#000 28%);mask-image:linear-gradient(270deg,transparent 0,#000 28%)}
#backdrop.img.wide.img2 #bdleft{display:block}
/* a place whose photo fills the whole screen (FULLBG): no blurred copy, no second photo */
#backdrop.img.full{background:var(--bdimg) var(--fx,60%) var(--fy,25%)/var(--fsz,cover) no-repeat;overflow:visible}
#backdrop.img.full::before{display:none}
#backdrop.img.full #bdleft{display:none}
/* phones: the photo is short, so its top edge melts into the sky colour above it instead of ending in a straight line */
#backdrop.img:not(.wide):not(.full)::before{content:"";position:absolute;left:0;right:0;top:var(--bdtop,0px);height:110px;background:linear-gradient(#2f6f95,rgba(47,111,149,0));pointer-events:none}
/* wide screens, full-picture places: the whole photo sits on the right (its left and bottom edges fade out), the second photo fills the left */
#bdright{display:none}
/* NIGHT: the same place under a dark blue sky, with stars and a moon (every second lap of the places) */
#bdstars{display:none;position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 70% 11%,#fff8d8 0 14px,rgba(255,248,216,.35) 15px 30px,rgba(255,248,216,0) 62px),
    radial-gradient(1.6px 1.6px at 8% 12%,#fff 98%,transparent),radial-gradient(1.3px 1.3px at 18% 26%,#fff 98%,transparent),radial-gradient(1.8px 1.8px at 29% 9%,#fff 98%,transparent),
    radial-gradient(1.2px 1.2px at 37% 21%,#fff 98%,transparent),radial-gradient(1.6px 1.6px at 47% 8%,#fff 98%,transparent),radial-gradient(1.3px 1.3px at 55% 24%,#fff 98%,transparent),
    radial-gradient(1.8px 1.8px at 64% 13%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 72% 27%,#fff 98%,transparent),radial-gradient(1.5px 1.5px at 93% 31%,#fff 98%,transparent),
    radial-gradient(1.3px 1.3px at 12% 38%,#fff 98%,transparent),radial-gradient(1.5px 1.5px at 41% 36%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 78% 6%,#fff 98%,transparent);
  animation:twinkle 4.5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}
#backdrop.night #bdstars{display:block}
#backdrop.night::after,#backdrop.night.img::after,#backdrop.night.rich::after{display:block!important;background:linear-gradient(rgba(6,10,40,.72),rgba(8,14,46,.55) 45%,rgba(5,8,28,.62) 75%,rgba(3,6,18,.75))!important;z-index:1}
#backdrop.night #bdstars{z-index:2}
.pthumb.night,.scene.night .sceneart,.scene.night .sceneimg{filter:brightness(.52) saturate(.8) hue-rotate(-8deg)}
@media (prefers-reduced-motion:reduce){#bdstars{animation:none}}
#backdrop.img.full.fwide{background:linear-gradient(to bottom,#aab0ba 0,#8c867a 42%,#3a2a1c 100%)}
#backdrop.img.full.fwide #bdright{display:block;position:absolute;inset:0;background:var(--bdimg) var(--rx,50%) var(--ry,0px)/var(--rsz,cover) no-repeat}
#backdrop.img.full.fwide.img2 #bdleft{display:block;left:0;top:0;width:66vw;height:100vh;background-size:auto 185%;background-position:25% -78vh;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 38%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.18) 82%,transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 38%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.18) 82%,transparent 100%)}
#backdrop.img.full::after{display:block;position:absolute;inset:0;left:0;top:0;width:auto;height:auto;mask-image:none;-webkit-mask-image:none;background:linear-gradient(rgba(4,10,16,.25),rgba(4,10,16,.05) 35%,rgba(4,10,16,.25) 65%,rgba(4,10,16,.6))}
#backdrop.img.wide::after{left:var(--wx);top:var(--wy);width:var(--ww);height:var(--wh);right:auto;bottom:auto;position:absolute;background:linear-gradient(rgba(4,10,16,.22),rgba(4,10,16,.05) 50%,rgba(4,10,16,.2)),var(--bdimg) 0 0/100% 100% no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28%);mask-image:linear-gradient(90deg,transparent 0,#000 28%)}

/* the pointing hand on everything you can tap; the open hand on the tiles (closed while one is dragged) */
button,[role=button],.slot3,.scene,.jr,.placechip,.vbadge,input.sw,label.swrow,.tbpick,#hand .tile,.tile[data-i],.stack,.overlay.dock #ovB{cursor:var(--hand)!important}
button:disabled,.slot3:disabled{cursor:not-allowed!important}
#hand .tile,.tile[data-i]{cursor:grab!important}
body.dragging,body.dragging *{cursor:grabbing!important}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;gap:8px}
header h1{font-size:22px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.01em;text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 14px rgba(0,0,0,.55)}
.hbtns{display:flex;gap:7px;align-items:center}
#rulesBtn,#histBtn{display:none!important} /* Rules and Past rounds live in Settings */
.hbtns button{min-height:36px;padding:6px 14px;font-size:13px;border-radius:999px}
.hbtns button.alt{background:transparent;color:var(--ink);border:1.5px solid rgba(243,238,226,.28)}
.hbtns button.gold{background:var(--gold);color:#2a2320;border:0}
.nin{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:inherit;font-size:16px}
.nin:focus{outline:2px solid var(--gold);outline-offset:1px}
.hist{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.hist .hhd{font-size:14px}.hist .hsc2{font-size:12px;color:var(--muted);margin-top:6px}
.tile.lastp{box-shadow:0 0 0 2px var(--gold),0 0 8px 1px rgba(255,205,100,.8)}
.hist .hdek{margin:6px 0 2px;padding:6px 10px;border-radius:10px;background:rgba(242,193,78,.14);border:1.5px solid var(--gold);font-size:13px;font-weight:700;color:var(--gold)}
.hist .hline{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 2px}
.hbtns button.gear{width:38px;padding:0;font-size:19px;line-height:1}
/* Settings stays visible over any picture: a solid dark round button */
.hbtns button.gear{background:rgba(14,22,30,.82)!important;border:1.5px solid rgba(255,255,255,.5)!important;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.tiebreak{margin:10px 0;padding:10px;border:1.5px solid var(--gold);border-radius:12px;font-size:13px;text-align:center}
.tbrow{display:flex;justify-content:center;gap:12px;margin-top:8px}
.tbpick{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);font-weight:700}
.tbpick.win{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);background:rgba(242,193,78,.1)}
.vieg{font-size:56px;font-weight:800;line-height:1;margin:0 0 6px;color:var(--gold);letter-spacing:-.02em;text-shadow:0 3px 0 rgba(0,0,0,.4),0 0 24px rgba(242,193,78,.45);
  animation:viegpop .8s cubic-bezier(.2,1.5,.4,1)}
.vieg.bad{color:var(--coral);text-shadow:0 3px 0 rgba(0,0,0,.4),0 0 24px rgba(240,138,122,.4)}
@keyframes viegpop{from{transform:scale(.25) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.vieg{animation:none}}
.pthumb{position:relative;flex:none;border-radius:12px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
  font-size:26px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18)}
.pthumb.jt1{width:58px;height:58px}
.jr{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px}

.felt{position:relative;width:100%;height:100%;transform-style:preserve-3d;border-radius:14px;

.hf i.on.r{background:#c8243f}
.t3 .tp.row .hf + .hf{border-left:1px solid #CDBF9C}

.slot3{position:absolute;border-radius:8px;border:3px dashed var(--gold);background:rgba(244,183,63,.2);padding:0;min-height:0;

/* your rack, in front of the table */

.rackbox .cap.l{left:-1px}.rackbox .cap.r{right:-1px}
.rackbox .lip{position:absolute;left:12px;right:12px;bottom:0;height:16px;border-radius:0 0 5px 5px;z-index:2;pointer-events:none;

  /* ==================== [C1] SOUND ==================== click, knock, celebrations: all made in the browser */
  /* ---- sound (made in the browser, no files) ---- */
  var AC=null;
  function audio(){
    try{
      if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
      if(AC&&AC.state==='suspended')AC.resume();
    }catch(e){}
    return AC;
  }
  var NOISE=null;
  function noiseBuf(ac){
    if(NOISE&&NOISE.sampleRate===ac.sampleRate)return NOISE;
    var n=Math.floor(ac.sampleRate*0.5),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
    return (NOISE=buf);
  }
  function synth(ac,kind){
    var now=ac.currentTime,R=Math.random;
    /* everything goes through a gentle limiter and a level, so the big celebrations never distort */
    var bus=ac.destination;
    if(kind==='vieg'||kind==='dek'||kind==='tonbe'){ /* only the celebrations; the click and the knock are left exactly as they are */
      var comp=ac.createDynamicsCompressor(),mg=ac.createGain();
      comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=8;comp.attack.value=0.003;comp.release.value=0.25;
      mg.gain.value={vieg:0.7,dek:0.7,tonbe:0.8}[kind];
      comp.connect(mg);mg.connect(ac.destination);bus=comp;
    }
    var beep=function(f,d,type,v,t0,f2){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type=type;o.frequency.setValueAtTime(f,now+t0);
      if(f2)o.frequency.exponentialRampToValueAtTime(f2,now+t0+d);
      g.gain.setValueAtTime(v,now+t0);g.gain.exponentialRampToValueAtTime(0.0001,now+t0+d);
      o.connect(g);g.connect(bus);o.start(now+t0);o.stop(now+t0+d+0.03);
    };
    /* a burst of filtered noise: the click of ivory on wood */
    var burst=function(freq,q,d,v,t0,type){
      var src=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
      src.buffer=noiseBuf(ac);fl.type=type||'bandpass';fl.frequency.value=freq;fl.Q.value=q;
      g.gain.setValueAtTime(v,now+t0);g.gain.exponentialRampToValueAtTime(0.0001,now+t0+d);
      src.connect(fl);fl.connect(g);g.connect(bus);src.start(now+t0,R()*0.3);src.stop(now+t0+d+0.02);
    };
    /* the last tile slammed on the table */
    var slam=function(t0,v){burst(600,0.8,0.13,0.9*v,t0,'lowpass');beep(95,0.28,'sine',0.9*v,t0,42);burst(2600,2,0.03,0.5*v,t0)};
    /* a crowd cheering: noise that swells and fades */
    var cheer=function(t0,d,v){
      var src=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
      src.buffer=noiseBuf(ac);src.loop=true;fl.type='bandpass';fl.frequency.value=1300;fl.Q.value=0.5;
      g.gain.setValueAtTime(0.0001,now+t0);g.gain.exponentialRampToValueAtTime(v,now+t0+d*0.25);g.gain.exponentialRampToValueAtTime(0.0001,now+t0+d);
      src.connect(fl);fl.connect(g);g.connect(bus);src.start(now+t0);src.stop(now+t0+d+0.02);
    };
    /* applause: many tiny claps at random moments */
    var applause=function(t0,d,v){for(var i=0;i<Math.floor(d*45);i++)burst(2200+R()*3200,1.1,0.012+R()*0.02,v*(0.4+R()*0.6),t0+R()*d)};
    var note=function(f,t0,d,v){beep(f,d,'triangle',v,t0);beep(f*2,d*0.7,'sine',v*0.35,t0)};
    var knock=function(t0,v){burst(500+R()*150,1.2,0.07,v*0.9,t0,'lowpass');beep(120+R()*30,0.09,'sine',v,t0,60)};
    if(kind==='tile'){
      var k=0.85+R()*0.3;
      burst(2300*k,2.2,0.035,0.6,0);burst(1100*k,1.5,0.05,0.35,0.004);beep(150*k,0.08,'sine',0.5,0,70);
      if(R()<0.4)burst(2600*k,3,0.02,0.25,0.05) /* a second, softer click as the tile settles */
    }
    else if(kind==='pass'){knock(0,0.55);knock(0.16+R()*0.04,0.45)}
    else if(kind==='win'){[392,494,587].forEach(function(f,i){beep(f,0.2,'triangle',0.3,i*0.12)})}
    else if(kind==='tonbe'){ /* your side's tonbe: slam, a quick fanfare, a cheer */
      slam(0,1);[523,659,784,1047].forEach(function(f,i){note(f,0.12+i*0.1,0.32,0.26)});cheer(0.12,1.0,0.16);applause(0.35,0.9,0.1)}
    else if(kind==='dek'){ /* dekabes: two slams, a longer fanfare, a bigger cheer */
      slam(0,1);slam(0.16,0.9);[523,659,784,1047,1319,1568].forEach(function(f,i){note(f,0.3+i*0.09,0.4,0.26)});cheer(0.3,1.4,0.2);applause(0.5,1.3,0.12)}
    else if(kind==='vieg'){ /* Viej: a drum roll, a big chord, applause */
      for(var d=0;d<14;d++)burst(300+d*20,0.7,0.07,0.28+d*0.02,d*d*0.0034+d*0.03,'lowpass');
      slam(0.62,1);[262,330,392,523,659].forEach(function(f){note(f,0.62,1.2,0.2)});
      [1047,1319,1568,2093].forEach(function(f,i){note(f,0.75+i*0.08,0.5,0.14)});cheer(0.65,1.8,0.2);applause(0.8,2.0,0.14)}
    else if(kind==='tick'){burst(1400+R()*600,1.2,0.09,0.35,0);burst(900,1,0.06,0.2,0.05)}
    else if(kind==='shuf'){burst(700+R()*1800,0.9,0.05+R()*0.04,0.22,0);if(R()<0.5)beep(180+R()*100,0.05,'sine',0.12,0.01)}
    else if(kind==='dek'){[392,494,587,784].forEach(function(f,i){beep(f,0.22,'triangle',0.3,i*0.11)})}
  }
  function sfx(kind){
    if(!S.sound)return;
    try{var ac=audio();if(ac)synth(ac,kind)}catch(e){}
  }

  /* ==================== [E1] BOARD AND RULES ==================== the line of tiles, layout and rows, the 3D table size (fitWorld) */

  function ends(){var c=S.chain;return c.length?{l:c[0].a,r:c[c.length-1].b}:null}

  function apply(c,tile,side){
    var n=c.slice();
    if(!c.length){var o0={a:tile[0],b:tile[1]};n.push(o0);S.fresh=o0;S.freshNew=true;return n}
    var e={l:c[0].a,r:c[c.length-1].b},o;
    if(side==='L'){o=tile[1]===e.l?{a:tile[0],b:tile[1]}:{a:tile[1],b:tile[0]};n.unshift(o)}

  function moves(hand){

  /* Board layout only: the chain still has two open ends, but it bends around the corners of the table so it never
     runs off the screen. At every bend one tile stands across (turn:true) and joins one row to the next; no branches. */
  function layout(chain,origin,U){
    var out=[],len=chain.length;
    function w(t){return t.a===t.b?1:2}
    var w0=w(chain[origin]),x0=Math.floor((U-w0)/2);
    out[origin]={i:origin,row:0,x:x0,w:w0,dir:1};
    var row=0,dir=1,edge=x0+w0,i,wi,x;
    for(i=origin+1;i<len;i++){
      wi=w(chain[i]);
      if(dir===1){
        if(edge+wi>U){out[i]={i:i,row:row+1,x:edge-1,w:1,dir:1,turn:true};row+=2;dir=-1}
        else{out[i]={i:i,row:row,x:edge,w:wi,dir:1};edge+=wi}
      }else{
        if(edge-wi<0){out[i]={i:i,row:row+1,x:edge,w:1,dir:1,turn:true};row+=2;dir=1}
        else{edge-=wi;out[i]={i:i,row:row,x:edge,w:wi,dir:-1}}
      }
    }
    var md=-1;row=0;edge=x0;
    for(i=origin-1;i>=0;i--){
      wi=w(chain[i]);
      if(md===-1){
        if(edge-wi<0){out[i]={i:i,row:row-1,x:edge,w:1,dir:1,turn:true};row-=2;md=1}
        else{edge-=wi;out[i]={i:i,row:row,x:edge,w:wi,dir:1}}
      }else{
        if(edge+wi>U){out[i]={i:i,row:row-1,x:edge-1,w:1,dir:1,turn:true};row-=2;md=-1}
        else{out[i]={i:i,row:row,x:edge,w:wi,dir:-1};edge+=wi}
      }
    }
    return out;
  }

  /* Rows are measured in half-cells (u). A flat row is 2u, a turn row 4u. A standing double is 4u tall and sticks out
     1u above and below its row; extra space is added only where it would hit a turn tile in the same column. */
  function planRows(pos,minR,maxR){
    var R=maxR-minR+1,kind=[],dc=[],tc=[],r,y=0,Y=[],total,any;
    for(r=0;r<R;r++){kind.push('f');dc.push({});tc.push(-1)}
    pos.forEach(function(q){
      r=q.row-minR;
      if(q.turn){kind[r]='t';tc[r]=q.x}else if(q.w===1)dc[r][q.x]=1;
    });
    function hasD(r){for(var k in dc[r])return true;return false}
    if(kind[0]==='f'&&hasD(0))y=1;
    for(r=0;r<R;r++){
      if(r>0){
        if(kind[r-1]==='f'&&kind[r]==='t'&&dc[r-1][tc[r]])y+=1;
        if(kind[r-1]==='t'&&kind[r]==='f'&&dc[r][tc[r-1]])y+=1;
      }

  /* smooth movement: remember where tiles were, then glide them from there to where they are now */
  function captureRects(root){

  function glide(root,old){
    var els,i,el,o,r,dx,dy,sx,sy;

    for(i=0;i<els.length;i++){
      el=els[i];o=old[el.getAttribute('data-k')];
      if(!o||!el.animate)continue;
      r=el.getBoundingClientRect();

      if(Math.abs(dx)<.5&&Math.abs(dy)<.5&&Math.abs(sx-1)<.02&&Math.abs(sy-1)<.02)continue;
      el.animate([{transformOrigin:'top left',transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')'},
        {transformOrigin:'top left',transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});
    }

  /* the table in design pixels; fitWorld scales it to the screen: tall on a phone (big tiles), wide on a desktop */
  function fitWorld(){
    var w=(typeof window!=='undefined'&&window.innerWidth)||390,hg=(typeof window!=='undefined'&&window.innerHeight)||800;
    S.portrait=w<760||hg>w*1.12;
    var tw=S.portrait?620:1040,th=S.portrait?740:620,cam=$('cam'),sc=$('scene3d');

  /* ==================== [E2] FLOW ==================== starting a game and a round, shuffling, the pile, the deal */
  /* ---- flow ---- */
  /* Tie on a blocked board: the tied players each pick one of the 28 tiles from a shuffled face-down pile; the lowest wins. */
  function tiePickUI(reps,done){
    var id=++S.pickId,card=$('card');
    var all=[];for(var a=0;a<=6;a++)for(var b=a;b<=6;b++)all.push([a,b]);
    var at=[],picked,msg,order,shuf,who,tiles;
    function alive(){return id===S.pickId}
    function show(){
      var h='<h2>'+t('tieTitle')+'</h2><p>'+msg+'</p><div class="pile'+(shuf?' shuf':'')+'">';
      order.forEach(function(i){
        if(picked[i])h+='<div class="tile h pkf" style="--s:14px">'+pips(at[i][0])+pips(at[i][1])+'</div>';
        else h+='<div class="pkb" data-pos="'+i+'"></div>';
      });
      h+='</div><p style="margin:0">'+tiles.map(function(x,j){return x?shortName(reps[j])+' '+x[0]+'-'+x[1]:''}).filter(Boolean).join('  ·  ')+'</p>';
      card.innerHTML=h;
    }
    function round(){
      picked={};tiles=reps.map(function(){return null});who=0;
      var ord=[];for(var i=0;i<28;i++)ord.push(i);
      msg=t('tieShuffle');shuf=true;order=ord.slice();
      card.onclick=null;
      var steps=0;
      (function step(){
        if(!alive())return;
        shuffle(order);sfx('shuf');show();
        if(++steps<7)return setTimeout(step,260);
        shuf=false;order=ord.slice();
        at=all.slice();shuffle(at);
        setTimeout(function(){if(alive())next()},300);
      })();
    }
    function take(pos){
      picked[pos]=true;tiles[who]=at[pos];sfx('tile');who++;
      msg=t('pickRes',{n:shortName(reps[who-1]),t:tiles[who-1][0]+'-'+tiles[who-1][1]});
      show();
      setTimeout(function(){if(alive())next()},900);
    }
    function next(){
      if(who>=reps.length)return finish();
      var p=reps[who];
      if(p===0){
        msg=t('pickYou');show();
        card.onclick=function(e){
          var b=e.target.closest('.pkb');if(!b||!alive())return;
          card.onclick=null;take(+b.dataset.pos);
        };
      }else{
        msg=t('pickBot',{n:shortName(p)});show();
        setTimeout(function(){
          if(!alive())return;

      msg=t('pickWin',{n:shortName(reps[idx[0]])});show();
      setTimeout(function(){if(alive())done({tiles:tiles,winner:reps[idx[0]]})},1600);
    }
    $('ov').classList.add('on');
    round();
  }

  /* Draw (pile game): take one tile from the pile, any position. The turn goes on: play it if it fits, else draw again. */
  function doDraw(p,idx){

    setTimeout(function(){if(S.bubbles[p]===callTxt&&!S.over){S.bubbles[p]='';render()}},1500);

  function tryDraw(){

    if(moves(S.players[0].hand).length){setMsg(t('mustPlay'));return}
    var r=b.getBoundingClientRect();

  /* ==================== [F1] COMPUTER PLAYERS ==================== five levels; the stronger ones guess the hidden tiles and search */
  /* ---- computer players ----
     choose(level,view) works only from what a real player can see: own hand, the board, who passed on what, hand sizes.
     1 random | 2 remembers passes | 3 counts numbers, plans a dekabes | 4-5 guess the hidden hands and play the round out (5 thinks longer). */
  var AI=(function(){
    var FULL=[];for(var a=0;a<=6;a++)for(var b=a;b<=6;b++)FULL.push([a,b]);
    function tmOf(n,p){return n===4?p%2:p}
    function fits(t,v){return t[0]===v||t[1]===v}
    function now(){return typeof performance!=='undefined'?performance.now():Date.now()}
    function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
    function bitCount(x){var c=0;while(x){c+=x&1;x>>=1}return c}
    function legal(hand,l,r){
      var m=[],i,t;
      for(i=0;i<hand.length;i++){
        t=hand[i];
        if(l===null){m.push({i:i,side:'R'});continue}
        if(fits(t,l))m.push({i:i,side:'L'});
        if(l!==r&&fits(t,r))m.push({i:i,side:'R'});
      }
      return m;
    }
    function endsAfter(t,l,r,side){
      if(l===null)return [t[0],t[1]];
      if(side==='L')return [t[0]===l?t[1]:t[0],r];
      return [l,t[0]===r?t[1]:t[0]];
    }
    function pipSum(h){var s=0;for(var i=0;i<h.length;i++)s+=h[i][0]+h[i][1];return s}

    /* level 2 score (also the quick policy inside the guessed games) */
    function scoreQuick(hand,m,l,r,miss,n,p){
      var t=hand[m.i];
      if(hand.length===1)return 1000;
      var e=endsAfter(t,l,r,m.side),sc=(t[0]+t[1])*0.6+(t[0]===t[1]?3:0),k,v,own,j,q;
      for(k=0;k<2;k++){
        v=e[k];own=0;
        for(j=0;j<hand.length;j++)if(j!==m.i&&fits(hand[j],v))own++;
        sc+=own*1.5;if(!own)sc-=1.5;
        for(q=0;q<n;q++){
          if(q===p||!((miss[q]>>v)&1))continue;
          sc+=tmOf(n,q)===tmOf(n,p)?-2.5:2.5;
        }
      }
      return sc;
    }

    /* what the player can work out from the table */
    function analyze(view){
      var pc=[0,0,0,0,0,0,0],oc=[0,0,0,0,0,0,0],seen={},u=[],v;
      function add(t,c){c[t[0]]++;if(t[1]!==t[0])c[t[1]]++;seen[t[0]*7+t[1]]=1;seen[t[1]*7+t[0]]=1}
      view.played.forEach(function(t){add(t,pc)});
      view.hand.forEach(function(t){add(t,oc)});
      for(v=0;v<7;v++)u.push(7-pc[v]-oc[v]);
      return {u:u,pc:pc,list:FULL.filter(function(t){return !seen[t[0]*7+t[1]]})};
    }

    /* level 3 score: number counting, partner care, control of both ends, setting up the last tile */
    function unseenOf(pc,hand,v){
      var c=7-pc[v],j;
      for(j=0;j<hand.length;j++)if(hand[j][0]===v||hand[j][1]===v)c--;
      return c;
    }
    var W={pip:0.45,dbl:6.88,own:0.58,noOwn:-2,missOpp:5,missPartner:0,deadOwn:5.75,deadNone:1,same:3,sameOwn:1.2,
      dekBoth:14,dekOne:3,stuck:0.5,plan:0,oppSmall:0.3,two0:-4.5};
    function scoreSkilled(view,an,m){return scoreSk(view.hand,m,view.l,view.r,view.miss,view.sizes,view.n,view.p,an.pc)}
    function scoreSk(hand,m,l,r,miss,sizes,n,p,pc){
      var t=hand[m.i];
      if(hand.length===1)return 1000+((l!==null&&l!==r&&fits(t,l)&&fits(t,r))?100:0);
      var e=endsAfter(t,l,r,m.side),nl=e[0],nr=e[1],rest=[],j,k,q,v,own;
      for(j=0;j<hand.length;j++)if(j!==m.i)rest.push(hand[j]);
      var sc=(t[0]+t[1])*W.pip+(t[0]===t[1]?W.dbl:0);
      for(k=0;k<2;k++){
        v=e[k];own=0;
        for(j=0;j<rest.length;j++)if(fits(rest[j],v))own++;
        sc+=own*W.own;if(!own)sc+=W.noOwn;
        for(q=0;q<n;q++){
          if(q===p||!((miss[q]>>v)&1))continue;
          sc+=tmOf(n,q)===tmOf(n,p)?W.missPartner:W.missOpp;
        }
        if(unseenOf(pc,hand,v)===0)sc+=own>0?W.deadOwn:W.deadNone;
      }
      if(nl===nr){
        own=0;for(j=0;j<rest.length;j++)if(fits(rest[j],nl))own++;
        sc+=W.same+own*W.sameOwn;
      }
      if(rest.length===1){
        var x=rest[0],f1=fits(x,nl),f2=fits(x,nr);
        if(f1&&f2&&nl!==nr)sc+=W.dekBoth;else if(f1||f2)sc+=W.dekOne;else sc+=W.stuck;
      }else if(rest.length===2){
        var fa=0,plan=false,o;
        for(j=0;j<2;j++){
          o=rest[1-j];
          if(fits(rest[j],nl)){fa++;if(fits(o,endsAfter(rest[j],nl,nr,'L')[0])||fits(o,nr))plan=true}
          if(fits(rest[j],nr)){if(fits(o,nl)||fits(o,endsAfter(rest[j],nl,nr,'R')[1]))plan=true}
        }
        if(fa===0&&!(fits(rest[0],nr)||fits(rest[1],nr)))sc+=W.two0;
        if(plan)sc+=W.plan;
      }
      for(q=0;q<n;q++)if(q!==p&&tmOf(n,q)!==tmOf(n,p)&&sizes[q]<=2)sc+=(t[0]+t[1])*W.oppSmall;
      return sc;
    }

    /* guessing games: deal the hidden tiles to the others, keeping what their passes told us */
    function sampleHands(view,an){
      var n=view.n,p=view.p,unseen=shuf(an.list.slice()),hands=[],others=[],q,i,need,mask,got,t;
      hands[p]=view.hand.slice();
      for(q=0;q<n;q++)if(q!==p)others.push(q);
      others.sort(function(x,y){return bitCount(view.miss[y])-bitCount(view.miss[x])});
      for(i=0;i<others.length;i++){
        q=others[i];need=view.sizes[q];mask=view.miss[q];got=[];
        for(var k=0;k<unseen.length&&got.length<need;){
          t=unseen[k];
          if(mask&&(((mask>>t[0])&1)||((mask>>t[1])&1))){k++;continue}
          got.push(t);unseen.splice(k,1);
        }
        while(got.length<need&&unseen.length)got.push(unseen.shift());
        hands[q]=got;
      }
      return {hands:hands,pile:unseen};
    }
    function playMove(sim,p,m){
      var hand=sim.hands[p],t=hand[m.i];
      var dek=sim.l!==null&&sim.l!==sim.r&&hand.length===1&&fits(t,sim.l)&&fits(t,sim.r);
      hand.splice(m.i,1);
      var e=endsAfter(t,sim.l,sim.r,m.side);sim.l=e[0];sim.r=e[1];
      sim.passes=0;sim.sizes[p]--;sim.pc[t[0]]++;if(t[1]!==t[0])sim.pc[t[1]]++;
      if(!hand.length)return {team:tmOf(sim.n,p),gain:dek?2:1};
      sim.turn=(p+1)%sim.n;return null;
    }
    function blockedResult(sim){
      var mins=[],p,k,s,best=1e9,tied=[];
      for(p=0;p<sim.n;p++){k=tmOf(sim.n,p);s=pipSum(sim.hands[p]);if(mins[k]===undefined||s<mins[k])mins[k]=s}
      for(k=0;k<mins.length;k++){if(mins[k]===undefined)continue;if(mins[k]<best){best=mins[k];tied=[k]}else if(mins[k]===best)tied.push(k)}
      return {team:tied[Math.floor(Math.random()*tied.length)],gain:1};
    }
    function passSim(sim,p){
      /* pile game: a player with no play draws and keeps the turn (play the tile or draw again) */
      if(sim.mode==='draw'&&sim.pile.length){sim.hands[p].push(sim.pile.pop());sim.sizes[p]++;sim.miss[p]=0;sim.passes=0;return null}
      if(sim.l!==null)sim.miss[p]|=(1<<sim.l)|(1<<sim.r);

    }
    var rollSkilled=true;
    function playOut(sim){
      var guard=0,p,mv,m,res,k,s,bs,hand;

              :scoreQuick(hand,mv[k],sim.l,sim.r,sim.miss,sim.n,p)+Math.random()*0.8);

    }
    /* how good a finished round is for my side; streaks count: a lead is worth protecting, an opposing streak worth breaking */
    function utility(res,view,mine){
      var w=view.wins,s=w[mine]||0,o=0,k;
      for(k=0;k<w.length;k++)if(k!==mine&&w[k]>o)o=w[k];
      if(res.team===mine)return res.gain+o*0.5+((s+res.gain>=view.target)?4:0);
      return -res.gain-s*0.7-((o+res.gain>=view.target)?4:0);

    function search(view,mv,level,opts){
      var samples=opts.samples||(level===4?120:3000);
      var budget=opts.budgetMs!==undefined?opts.budgetMs:(level===4?300:800);
      var an=analyze(view),mine=tmOf(view.n,view.p),tot=[],i,cnt=0,t0=now(),sm,sim,res;

  function botView(p){

  /* ==================== [G1] END OF ROUND ==================== points in a row, Viej, tie-break, the result card, past rounds (24 hours) */

  /* ==================== [H2] TAPS AND DRAGGING ==================== every button and tap, dragging tiles, closing panels */
  /* ---- events ---- */
  $('hand').addEventListener('click',function(e){
    if(S.dragLock)return;
    var el=e.target.closest('.tile');if(!el||S.turn!==0||S.over||S.busy||S.shuffling)return;
    var i=+el.getAttribute('data-i');
    var mv=moves(S.players[0].hand).filter(function(m){return m.i===i});
    if(!mv.length){setMsg(t('noMatch'));return}
    /* the last tile fitting both ends is a dekabes: it wins on either side, so no need to ask */
    var eC=ends();
    if(mv.length===1||!S.chain.length||S.players[0].hand.length===1||eC.l===eC.r)return playTile(0,i,mv[0].side);
    S.sel=S.sel===i?null:i;render();
  });
  /* Dragging: press a tile in your rack and drag it onto the table. A copy follows your finger; the sides where it fits light up.
     Let go over the table: it plays (on the nearer end when both ends fit). Let go anywhere else: it slides back. A plain tap still works. */
  (function(){
    var D=null;
    function slotsFor(i){
      var tile=S.players[0].hand[i],e=ends(),out=[];
      if(!e||!tile)return out;
      var els=document.querySelectorAll('#chain .slot3'),k;
      for(k=0;k<els.length;k++){
        var side=els[k].getAttribute('data-side'),val=side==='L'?e.l:e.r;
        if(fits(tile,val))out.push(els[k]);
      }
      return out;
    }
    function center(el){var r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}}
    function over(x,y,el){var r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
    function clearMarks(){
      var m=document.querySelectorAll('.slot3.drop'),k;
      for(k=0;k<m.length;k++){m[k].classList.remove('drop');m[k].classList.remove('over')}
      $('felt').classList.remove('dropzone');
    }
    function end(commit,x,y){
      var d=D;D=null;
      document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);document.removeEventListener('pointercancel',onCancel);
      if(!d||!d.on)return;
      var side=null;
      if(commit&&over(x,y,$('felt'))){
        var mv=moves(S.players[0].hand).filter(function(m){return m.i===d.i}),eC=ends();
        if(mv.length&&S.turn===0&&!S.over&&!S.busy&&!S.shuffling){
          if(mv.length===1||!S.chain.length||S.players[0].hand.length===1||eC.l===eC.r)side=mv[0].side;
          else{ /* both ends fit: the end nearer to where you let go */
            var best=1e9;
            slotsFor(d.i).forEach(function(el){var c=center(el),dd=Math.pow(c.x-x,2)+Math.pow(c.y-y,2);if(dd<best){best=dd;side=el.getAttribute('data-side')}});
          }
        }
      }
      clearMarks();document.body.classList.remove('dragging');
      var g=d.ghost;
      S.dragLock=true;setTimeout(function(){S.dragLock=false},120);
      if(side){
        S.dragFrom={x:x,y:y,w:d.w};
        if(g.parentNode)g.parentNode.removeChild(g);
        playTile(0,d.i,side);
      }else{
        var back=d.el.getBoundingClientRect?d.el.getBoundingClientRect():null;
        var done=function(){if(g.parentNode)g.parentNode.removeChild(g);if(d.el&&d.el.classList)d.el.classList.remove('lifted')};
        if(g.animate&&back&&d.el.isConnected){
          var a=g.animate([{transform:g.style.transform},{transform:'translate('+(back.left)+'px,'+(back.top)+'px) scale(1)'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
          a.onfinish=done;a.oncancel=done;
        }else done();
      }
    }
    function onMove(e){
      if(!D||e.pointerId!==D.id)return;
      var dx=e.clientX-D.x0,dy=e.clientY-D.y0;
      if(!D.on){
        if(dx*dx+dy*dy<64)return; /* under 8 px: still a tap */
        if(S.turn!==0||S.over||S.busy||S.shuffling){D=null;return}
        var mv=moves(S.players[0].hand).filter(function(m){return m.i===D.i});
        if(!mv.length){D=null;return} /* a tile that cannot play is not picked up: the tap tells you why */
        D.on=true;S.sel=null;
        var r=D.el.getBoundingClientRect(),g=document.createElement('div');
        g.className='dragghost';
        var hs=parseFloat($('hand').style.getPropertyValue('--hs'))||36;
        g.innerHTML='<div class="tile v" style="--s:'+hs+'px">'+D.el.innerHTML+'</div>';
        document.body.appendChild(g);
        D.ghost=g;D.w=r.width;D.hw=r.width/2;D.hh=r.height/2;
        D.el.classList.add('lifted');document.body.classList.add('dragging');
        slotsFor(D.i).forEach(function(el){el.classList.add('drop')});
        $('felt').classList.add('dropzone');
        sfx('tick');
      }
      e.preventDefault();
      D.ghost.style.transform='translate('+(e.clientX-D.hw)+'px,'+(e.clientY-D.hh)+'px) scale(1.2)';
      var near=null,nd=1e9;
      slotsFor(D.i).forEach(function(el){
        var c=center(el),dd=Math.pow(c.x-e.clientX,2)+Math.pow(c.y-e.clientY,2);
        el.classList.remove('over');
        if(dd<nd){nd=dd;near=el}
      });
      if(near&&(over(e.clientX,e.clientY,near)||nd<80*80))near.classList.add('over');
    }
    function onUp(e){if(D&&e.pointerId===D.id)end(true,e.clientX,e.clientY)}
    function onCancel(e){if(D&&e.pointerId===D.id)end(false,e.clientX,e.clientY)}
    $('hand').addEventListener('pointerdown',function(e){
      if(D||(e.pointerType==='mouse'&&e.button!==0))return;
      var el=e.target.closest&&e.target.closest('.tile');
      if(!el||S.turn!==0||S.over||S.busy||S.shuffling)return;
      D={el:el,i:+el.getAttribute('data-i'),id:e.pointerId,x0:e.clientX,y0:e.clientY,on:false,ghost:null};
      document.addEventListener('pointermove',onMove,{passive:false});
      document.addEventListener('pointerup',onUp);document.addEventListener('pointercancel',onCancel);
    });
  })();
  /* choosing the side: tap the gold slot at the end you want */
  $('felt').addEventListener('click',function(e){
    if(S.dragLock)return;
    var b=e.target.closest&&e.target.closest('.slot3');
    if(b){if(!b.disabled&&S.sel!==null&&S.turn===0&&!S.over&&!S.busy&&!S.shuffling)playTile(0,S.sel,b.getAttribute('data-side'));return}
    if(S.sel!==null){S.sel=null;render()} /* tap elsewhere on the felt: cancel the chosen tile */
  });
  $('passBtn').addEventListener('click',tryDraw);
  ['N','W','E'].forEach(function(k){$('stack'+k).addEventListener('click',pileClick)});
  $('tonbeBtn').addEventListener('click',function(){
    if(S.turn!==0||S.over||S.busy||S.shuffling)return;
    var h=S.players[0].hand;
    if(h.length!==1){setMsg(t('tonbeNo1'));return}
    var mv=moves(h);
    if(!mv.length){setMsg(t('tonbeNo2'));return}
    playTile(0,0,mv[0].side);
  });
  $('rulesBtn').addEventListener('click',openRules);
  $('setBtn').addEventListener('click',openSettings);
  /* tap on the dark area around a panel (tour, settings, past rounds, names, photos, rules) or press Esc: it closes */
  var NOCLOSE=false;try{NOCLOSE=/[?&]noclose=1/.test(location.search||'')}catch(e){} /* index.html?noclose=1 turns the tap-to-close feature off (to test it) */
  if(!NOCLOSE)$('ov2').addEventListener('click',function(e){if(e.target===$('ov2'))$('ov2').classList.remove('on')});
  if(!NOCLOSE&&typeof document.addEventListener==='function')document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('ov2').classList.contains('on'))$('ov2').classList.remove('on')});
  $('histBtn').addEventListener('click',openHistory);
  /* tapping a Viej star shows its count for a moment (a phone has no hover) */
  $('scores').addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.vbadge');if(!b)return;b.classList.add('open');setTimeout(function(){b.classList.remove('open')},2200)});
  $('placebar').addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.scene'))openJourney()});
  $('menuBtn').addEventListener('click',function(){
    trace('Nouvo jwet tapped');
    try{S.over=true;S.pickId++;cancelDeal();S.shuffling=false;S.busy=false;$('ov2').classList.remove('on');openSetup();if(!$('ov').classList.contains('on'))throw new Error('start screen did not open')}
    catch(e){ /* never leave the player without a way out: forget the saved game and start clean */
      noteError('newgame',e);
      try{localStorage.removeItem(GKEY)}catch(x){}
      try{location.reload()}catch(x){}
    }
  });

  window.addEventListener('resize',function(){fitWorld();fitBackdrop();if(S.started)render()});
  fitWorld();

  /* pick up a saved game: same tiles, same line, same score, same turn; a result card on screen comes back too */
  /* ==================== [I1] START UP ==================== pick up a saved game, reset links, the watchdog that rescues a stuck round */
  function resume(v){
    S.n=v.n;S.mode=v.mode==='draw'?'draw':'nodraw';S.level=v.level||1;S.players=v.players;S.pile=v.pile;S.chain=v.chain;
    S.origin=v.origin||0;S.turn=v.turn;S.passes=v.passes||0;S.leader=v.leader||0;S.wins=v.wins;S.vieg=v.vieg||[];
    S.over=!!v.over;S.dek=!!v.dek;S.carry=v.carry||null;S.pendingEnd=v.pendingEnd===undefined?null:v.pendingEnd;S.lastCard=v.lastCard||null;S.history=Array.isArray(v.history)?v.history:[];S.histN=v.histN||0;
    S.players.forEach(function(pl){if(!pl.missing)pl.missing={}});
    S.started=true;S.shuffling=false;S.busy=false;S.sel=null;S.fresh=null;S.bubbles={};S.lang=S.cfg.lang;
    render();
    if(S.lastCard){showResultCard(S.lastCard.html,S.lastCard.done);return true}
    if(S.over){
      if(S.pendingEnd===null)return false;
      var w=S.pendingEnd==='b'?null:S.pendingEnd;
      later(function(){endRound(w)},400);
      return true;
    }
    setMsg(S.turn===0?t('yourTurn'):'');
    schedule();
    return true;
  }
  /* index.html?reset=1 forgets the saved game and the past rounds (a way out if a saved game ever misbehaves) */
  try{if(typeof location!=='undefined'&&/[?&]reset=1/.test(location.search||'')){localStorage.removeItem(GKEY);localStorage.removeItem(ERRKEY)}}catch(e){}
  /* index.html?reset=all also forgets the saved settings and names (wins and places are kept) */
  try{if(typeof location!=='undefined'&&/[?&]reset=all/.test(location.search||'')){localStorage.removeItem(GKEY);localStorage.removeItem(ERRKEY);localStorage.removeItem(KEY);saveProgress()}}catch(e){}
  var saved=loadSaved(),resumed=false;
  try{resumed=!!(saved&&resume(saved))}
  catch(e){ /* a saved game that cannot be opened is thrown away, so it can never trap the player on a frozen board */
    noteError('resume',e);try{localStorage.removeItem(GKEY)}catch(x){}
    resumed=false;S.over=true;S.busy=false;S.lastCard=null;
  }
  if(!resumed){try{render()}catch(e){noteError('render',e)}openSetup()}

  /* watchdog: a round that is over, with nothing on screen to continue from, is finished for the player (result card), never left frozen */
  var wdHits=0,wdBusy=0;
  setInterval(function(){
    S.hb=Date.now();
    try{
      /* the 'busy' flag is only meant to last a second or two; if it is still on after 7 seconds in a finished round, it is stuck */
      if(S.started&&S.over&&S.busy&&!S.shuffling&&!dealState&&!$('ov').classList.contains('on')){if(++wdBusy>=5){wdBusy=0;noteError('watchdog','busy flag stuck');S.busy=false}}else wdBusy=0;
      var emptyAt=S.players.map(function(pl){return pl.hand.length}).indexOf(0);
      if(S.started&&!S.over&&!S.busy&&!S.shuffling&&!dealState&&emptyAt>=0&&!$('ov').classList.contains('on')){ /* someone has no tiles left but the round never ended */
        if(++wdHits>=2){wdHits=0;noteError('watchdog','player '+emptyAt+' has no tiles, round not over');S.over=true;endRound(emptyAt)}
        return;
      }
      var stuck=S.started&&S.over&&!S.busy&&!S.shuffling&&!dealState&&!$('ov').classList.contains('on');
      if(!stuck){wdHits=0;return}
      if(++wdHits<2)return;
      wdHits=0;
      noteError('watchdog','round over with no card (pendingEnd='+S.pendingEnd+')');
      var who=S.players.map(function(pl){return pl.hand.length}).indexOf(0);
      if(S.lastCard){showResultCard(S.lastCard.html,S.lastCard.done)}
      else if(S.pendingEnd!==null&&S.pendingEnd!==undefined){endRound(S.pendingEnd==='b'?null:S.pendingEnd)}
      else if(who>=0){endRound(who)}
      else openSetup();
    }catch(e){noteError('watchdog-fail',e)}
  },1500);
})();
</script>
<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
